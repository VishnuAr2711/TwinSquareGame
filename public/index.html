<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twin Squares</title>
<style>
  :root{
    --bg:#0d1018; --panel:#151a27; --panel2:#1b2233;
    --ink:#e8edf7; --dim:#8b97ad; --line:#232c40;
    --a:#2dd4bf; --a-glow:rgba(45,212,191,.55);
    --b:#f472b6; --b-glow:rgba(244,114,182,.55);
    --wall:#212a3e; --wall-hi:#2c3854;
    --good:#7ee787;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #131a29 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;padding:18px 14px 28px;gap:14px;
    user-select:none;
  }
  .title{display:flex;align-items:center;gap:12px;margin-top:4px}
  .title h1{
    font-size:26px;letter-spacing:.5px;margin:0;font-weight:800;
    background:linear-gradient(90deg,var(--a),#8bd,var(--b));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .title .dot{width:12px;height:12px;border-radius:4px}
  .hud{
    width:min(92vw,576px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  }
  .hud .lv{font-weight:700;font-size:15px}
  .hud .lv small{color:var(--dim);font-weight:600}
  .hud .tag{color:var(--dim);font-size:12.5px;margin-top:3px;max-width:60ch}
  .stats{display:flex;gap:16px;text-align:right;font-variant-numeric:tabular-nums}
  .stats b{display:block;font-size:20px;line-height:1}
  .stats span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
  .stagewrap{position:relative;width:min(92vw, 576px, calc((100vh - 360px) * 11 / 7))}
  canvas{
    width:100%;height:auto;display:block;border-radius:16px;
    background:linear-gradient(180deg,#121826,#0e131e);
    box-shadow:0 18px 50px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.04);
    touch-action:none;
  }
  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,11,18,.72);backdrop-filter:blur(3px);border-radius:16px;text-align:center;
  }
  .overlay.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{padding:26px 30px}
  .card h2{margin:0 0 6px;font-size:26px}
  .card p{margin:0 0 16px;color:var(--dim);font-size:14px}
  .card .big{font-size:15px;color:var(--ink)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{
    font:inherit;font-weight:700;color:var(--ink);cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 18px;transition:transform .06s ease,background .15s ease,border-color .15s;
  }
  button:hover{background:#232d44;border-color:#33405f}
  button:active{transform:translateY(1px) scale(.98)}
  button.primary{background:linear-gradient(180deg,var(--a),#1eae9d);border-color:transparent;color:#04201c}
  button.primary:hover{filter:brightness(1.06)}
  .actions{width:min(92vw,576px);display:flex;justify-content:center;gap:12px}
  .actions button{min-width:120px}
  .controls{width:min(92vw,576px);display:flex;flex-direction:column;align-items:center;gap:10px}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px}
  .dpad button{padding:0;font-size:20px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .dpad .up{grid-area:1/2} .dpad .left{grid-area:2/1} .dpad .down{grid-area:3/2} .dpad .right{grid-area:2/3}
  .dpad .spacer{visibility:hidden}
  .keys{color:var(--dim);font-size:12px;line-height:1.6;text-align:center}
  .keys kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:11px;color:var(--ink)}
  .levelnav{width:min(92vw,576px);display:flex;gap:12px;justify-content:space-between;align-items:center}
  .levelnav .prog{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .levelnav .prog b{color:var(--good)}
  .tierbadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;color:#0b0f17}
  /* level-select modal */
  .modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(6,9,14,.80);backdrop-filter:blur(4px);
    align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;
    padding:18px 18px 20px;box-shadow:0 30px 80px -20px #000}
  .sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .sheet .head h2{margin:0;font-size:19px}
  .sheet .subhead{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .sheet .subhead b{color:var(--good)}
  .tiergroup{margin-bottom:14px}
  .tiergroup .tl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--dim);margin:0 2px 7px}
  .tiergroup .tl .sw{width:10px;height:10px;border-radius:3px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .lvlgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .lg{position:relative;aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2);
    color:var(--dim);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .lg:hover{filter:brightness(1.15)}
  .lg.done{color:#0b1410}
  .lg.cur{outline:2px solid #fff;outline-offset:1px}
  .lg .star{position:absolute;top:-5px;right:-3px;font-size:11px;color:#ffd166;text-shadow:0 1px 2px #000}
  .sheet .foot{display:flex;justify-content:flex-end;margin-top:6px}
  .sheet .foot .danger{color:#ff9db0;border-color:#5a2733;background:#241820;font-size:12px;padding:8px 12px}
  /* ---- mobile / narrow portrait ----
     Everything fits ONE fixed screen (no scroll). The DOM already orders things
     title → HUD → Undo/Reset → BOARD → Levels → d-pad. The board width is capped
     by the leftover height so nothing overflows, and space-between spreads the
     sections to fill the screen. */
  @media (max-width:600px){
    body{height:100vh;height:100dvh;min-height:0;overflow:hidden;
         padding:8px 6px 10px;gap:6px;justify-content:space-between}
    .title{margin-top:0;gap:8px}
    .title h1{font-size:19px}
    .title .dot{width:9px;height:9px}
    .hud{width:100%;align-items:center}
    .hud .lv{font-size:13.5px}
    .hud .tag{font-size:11px;margin-top:2px}
    .stats b{font-size:17px}
    /* Undo / Reset — big, above the board */
    .actions{width:100%;gap:10px}
    .actions button{flex:1;max-width:240px;padding:11px 0;font-size:15px;min-width:0}
    /* Board — the big element; width capped by remaining height so it never scrolls */
    .stagewrap{width:min(96vw, calc((100dvh - 452px) * 11 / 7))}
    .levelnav{width:100%}
    /* d-pad — at the bottom thumb zone, always on-screen */
    .controls{width:100%;gap:4px}
    .keys{display:none}
    .dpad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:8px}
    .dpad button{font-size:22px;border-radius:14px}
    .lvlgrid{gap:4px} .lg{font-size:11px}
    .sheet{padding:16px 14px 18px}
  }
  /* shorter phones: shrink the d-pad so the fixed screen still fits */
  @media (max-width:600px) and (max-height:680px){
    .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:7px}
    .stagewrap{width:min(96vw, calc((100dvh - 420px) * 11 / 7))}
  }
</style>
</head>
<body>
  <div class="title">
    <span class="dot" style="background:var(--a);box-shadow:0 0 12px var(--a-glow)"></span>
    <h1>Twin Squares</h1>
    <span class="dot" style="background:var(--b);box-shadow:0 0 12px var(--b-glow)"></span>
  </div>

  <div class="hud">
    <div>
      <div class="lv">Level <span id="lvnum">1</span><small> / <span id="lvtot">100</span></small> — <span id="lvname">—</span><span class="tierbadge" id="tierbadge"></span></div>
      <div class="tag" id="lvtag"></div>
    </div>
    <div class="stats">
      <div><b id="moves">0</b><span>Moves</span></div>
      <div><b id="par">–</b><span>Par</span></div>
    </div>
  </div>

  <div class="actions">
    <button id="undoBtn">↶ Undo</button>
    <button id="resetBtn">⟲ Reset</button>
  </div>

  <div class="stagewrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovtitle">Level Complete</h2>
        <p id="ovsub"></p>
        <div class="row" id="ovrow"></div>
      </div>
    </div>
  </div>

  <div class="levelnav">
    <button id="levelsBtn">▦ Levels</button>
    <div class="prog"><b id="solvedCount">0</b> / <span id="totalCount">100</span> solved</div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="up"    aria-label="up"    data-dir="-1,0">▲</button>
      <button class="left"  aria-label="left"  data-dir="0,-1">◀</button>
      <button class="down"  aria-label="down"  data-dir="1,0">▼</button>
      <button class="right" aria-label="right" data-dir="0,1">▶</button>
    </div>
    <div class="keys">
      Move <kbd>← ↑ ↓ →</kbd> / <kbd>WASD</kbd> &nbsp; <kbd>Z</kbd> undo &nbsp; <kbd>R</kbd> reset
    </div>
  </div>

  <div class="modal" id="lvlmodal">
    <div class="sheet">
      <div class="head">
        <h2>Select a Level</h2>
        <button id="closeModal">✕</button>
      </div>
      <div class="subhead"><b id="solvedCount2">0</b> / 100 solved · tap any level to play</div>
      <div id="lvlgrid"></div>
      <div class="foot"><button class="danger" id="resetProgress">Reset all progress</button></div>
    </div>
  </div>

// ---- level parsing + embedded BFS (single source of truth for "par") -------
const DIRS = [
  {dr:-1,dc:0,name:'U'}, {dr:1,dc:0,name:'D'}, {dr:0,dc:-1,name:'L'}, {dr:0,dc:1,name:'R'}
];

// ---- difficulty tiers + saved progress -------------------------------------
// Contiguous difficulty blocks: 20% very easy, 25% easy, 30% medium, 25% above medium.
const TIERS = [
  {name:'Very easy',    start:0,  end:20,  color:'#7ee787'},
  {name:'Easy',         start:20, end:45,  color:'#63c8ff'},
  {name:'Medium',       start:45, end:75,  color:'#ffd166'},
  {name:'Above medium', start:75, end:100, color:'#ff9f68'},
];
function tierOf(i){ return TIERS.find(t=>i>=t.start&&i<t.end) || TIERS[TIERS.length-1]; }

const SAVE_KEY='twinSquares.v1';
let progress = {best:{}, last:0};
function loadProgress(){ try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&s.best) progress={best:s.best||{}, last:s.last||0};}catch(e){} }
function saveProgress(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); }catch(e){} }
function solvedCount(){ return Object.keys(progress.best).length; }
function markSolved(i,moves){ const p=progress.best[i]; if(p==null||moves<p) progress.best[i]=moves; }
let parCache={};
function parCached(i){ if(parCache[i]==null) parCache[i]=parOf(parseLevel(LEVELS[i])); return parCache[i]; }
function parseLevel(spec){
  const g = spec.grid;
  const rows = g.length, cols = g[0].length;
  const wall = [], ice = [];
  let A,B,a,b;
  for(let r=0;r<rows;r++){
    wall.push([]); ice.push([]);
    for(let c=0;c<cols;c++){
      const ch=g[r][c];
      wall[r][c] = ch==='#';
      ice[r][c]  = ch==='~';
      if(ch==='A')A={r,c}; if(ch==='B')B={r,c};
      if(ch==='a')a={r,c}; if(ch==='b')b={r,c};
    }
  }
  return {rows,cols,wall,ice,A,B,a,b,name:spec.name,tag:spec.tag};
}
function passable(lv,r,c){ return r>=0&&r<lv.rows&&c>=0&&c<lv.cols&&!lv.wall[r][c]; }
// Move one step; if you land on ice, keep sliding the same direction until the
// next cell is blocked (or you slide onto normal floor and stop there).
function tryStep(lv,p,dr,dc){
  let nr=p.r+dr, nc=p.c+dc;
  if(!passable(lv,nr,nc)) return p;
  let r=nr, c=nc;
  while(lv.ice[r][c]){
    const r2=r+dr, c2=c+dc;
    if(!passable(lv,r2,c2)) break;
    r=r2; c=c2;
  }
  return {r,c};
}
function parOf(lv){
  const key=(A,B)=>`${A.r},${A.c},${B.r},${B.c}`;
  const start=key(lv.A,lv.B), goal=key(lv.a,lv.b);
  if(start===goal) return 0;
  let frontier=[[lv.A,lv.B]]; const seen=new Set([start]); let depth=0;
  while(frontier.length){
    const next=[];
    for(const [A,B] of frontier){
      for(const d of DIRS){
        const nA=tryStep(lv,A,d.dr,d.dc);
        const nB=tryStep(lv,B,d.dr,d.dc);
        const k=key(nA,nB);
        if(seen.has(k))continue;
        if(k===goal)return depth+1;
        seen.add(k); next.push([nA,nB]);
      }
    }
    frontier=next; depth++;
    if(depth>60)return null;
  }
  return null;
}

// ---- rendering setup -------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = 64;
let lv, cur = {A:null,B:null}, render = {A:null,B:null};
let bump = {A:{x:0,y:0,t:0}, B:{x:0,y:0,t:0}};
let undoStack = [], moveCount = 0, levelIndex = 0, maxReached = 0;
let status = 'play'; // 'play' | 'won'
let winPulse = 0;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = lv.cols*CELL, H = lv.rows*CELL;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.aspectRatio = `${W} / ${H}`;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
const cx = c => c*CELL + CELL/2;
const cy = r => r*CELL + CELL/2;

function loadLevel(i){
  levelIndex = i;
  maxReached = Math.max(maxReached, i);
  lv = parseLevel(LEVELS[i]);
  cur = {A:{...lv.A}, B:{...lv.B}};
  render = {A:{x:cx(lv.A.c),y:cy(lv.A.r)}, B:{x:cx(lv.B.c),y:cy(lv.B.r)}};
  bump = {A:{x:0,y:0,t:0}, B:{x:0,y:0,t:0}};
  undoStack = []; moveCount = 0; status='play'; winPulse=0;
  sizeCanvas();
  const t=tierOf(i);
  document.getElementById('lvnum').textContent = i+1;
  document.getElementById('lvtot').textContent = LEVELS.length;
  document.getElementById('lvname').textContent = lv.name;
  const badge=document.getElementById('tierbadge'); badge.textContent=t.name; badge.style.background=t.color;
  document.getElementById('lvtag').textContent = lv.tag;
  document.getElementById('par').textContent = parCached(i) ?? '–';
  progress.last=i; saveProgress();
  updateHud(); updateSolvedUI(); hideOverlay();
}
function updateHud(){ document.getElementById('moves').textContent = moveCount; }
function updateSolvedUI(){
  const n=solvedCount();
  ['solvedCount','solvedCount2'].forEach(id=>{const el=document.getElementById(id); if(el)el.textContent=n;});
}

function buildLevelGrid(){
  const host=document.getElementById('lvlgrid'); host.innerHTML='';
  TIERS.forEach(t=>{
    const group=document.createElement('div'); group.className='tiergroup';
    const label=document.createElement('div'); label.className='tl';
    label.innerHTML=`<span class="sw" style="background:${t.color}"></span>${t.name} · ${t.start+1}–${t.end}`;
    group.appendChild(label);
    const grid=document.createElement('div'); grid.className='lvlgrid';
    for(let i=t.start;i<t.end;i++){
      const b=document.createElement('button'); b.className='lg';
      b.textContent=i+1; b.style.borderColor=t.color;
      const best=progress.best[i], par=parCached(i);
      if(best!=null){ b.classList.add('done'); b.style.background=t.color;
        b.title=`${LEVELS[i].name} — best ${best} (par ${par})`;
        if(best<=par){const s=document.createElement('span');s.className='star';s.textContent='★';b.appendChild(s);}
      } else { b.title=`${LEVELS[i].name} — par ${par}`; }
      if(i===levelIndex) b.classList.add('cur');
      b.onclick=()=>{ closeLevelSelect(); loadLevel(i); };
      grid.appendChild(b);
    }
    group.appendChild(grid); host.appendChild(group);
  });
}
function openLevelSelect(){ buildLevelGrid(); updateSolvedUI(); document.getElementById('lvlmodal').classList.add('show'); }
function closeLevelSelect(){ document.getElementById('lvlmodal').classList.remove('show'); }

// ---- movement --------------------------------------------------------------
function move(dr,dc){
  if(status!=='play') return;
  const nA = tryStep(lv, cur.A, dr, dc);
  const nB = tryStep(lv, cur.B, dr, dc);    // B moves in parallel (same direction)
  const movedA = (nA!==cur.A), movedB = (nB!==cur.B);

  if(!movedA && !movedB){ // both blocked: feedback only, not a move
    kick('A',dr,dc); kick('B',dr,dc); return;
  }
  undoStack.push({A:{...cur.A},B:{...cur.B}});
  if(!movedA) kick('A',dr,dc);            // one square held by a wall — show it
  if(!movedB) kick('B',dr,dc);
  cur.A = {...nA}; cur.B = {...nB};
  moveCount++; updateHud();
}
function kick(which,dr,dc){ // little bump toward the wall the twin hit
  bump[which] = {x:dc*8, y:dr*8, t:1};
}
function undo(){
  if(status!=='play' || !undoStack.length) return;
  const p = undoStack.pop();
  cur.A={...p.A}; cur.B={...p.B};
  moveCount=Math.max(0,moveCount-1); updateHud();
}
function reset(){ if(undoStack.length||status!=='play'){ loadLevel(levelIndex); } }

function checkWin(){
  return cur.A.r===lv.a.r && cur.A.c===lv.a.c && cur.B.r===lv.b.r && cur.B.c===lv.b.c;
}
function settled(){
  const near=(p,tr,tc)=>Math.abs(p.x-cx(tc))<0.6 && Math.abs(p.y-cy(tr))<0.6;
  return near(render.A,cur.A.r,cur.A.c) && near(render.B,cur.B.r,cur.B.c);
}

// ---- overlay ---------------------------------------------------------------
function showWin(){
  status='won'; winPulse=1;
  const par = parCached(levelIndex);
  const optimal = par!=null && moveCount<=par;
  markSolved(levelIndex, moveCount); saveProgress(); updateSolvedUI();
  const last = levelIndex===LEVELS.length-1;
  const ov=document.getElementById('overlay');
  document.getElementById('ovtitle').textContent = last?"You beat all 100! 🎉":(optimal?"Optimal! ⭐":"Level Complete");
  let sub = `Solved in ${moveCount} move${moveCount===1?'':'s'}`;
  if(par!=null){ sub += optimal ? ` — that's par!` : ` (par ${par})`; }
  document.getElementById('ovsub').textContent = sub;
  const row=document.getElementById('ovrow'); row.innerHTML='';
  const mk=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b;};
  if(last){
    row.appendChild(mk('Play again','primary',()=>loadLevel(0)));
    row.appendChild(mk('Level select',null,openLevelSelect));
  }else{
    row.appendChild(mk('Next ▶','primary',()=>loadLevel(levelIndex+1)));
    row.appendChild(mk('Replay',null,()=>loadLevel(levelIndex)));
  }
  ov.classList.add('show');
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function advance(){ if(levelIndex<LEVELS.length-1) loadLevel(levelIndex+1); else loadLevel(0); }

// ---- draw ------------------------------------------------------------------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCellRect(r,c,inset,rad){ roundRect(c*CELL+inset, r*CELL+inset, CELL-2*inset, CELL-2*inset, rad); }

function draw(){
  const W=lv.cols*CELL, H=lv.rows*CELL;
  ctx.clearRect(0,0,W,H);

  // faint floor cells
  for(let r=0;r<lv.rows;r++)for(let c=0;c<lv.cols;c++){
    if(lv.wall[r][c])continue;
    ctx.fillStyle='rgba(255,255,255,.022)';
    drawCellRect(r,c,7,10); ctx.fill();
  }
  // ice tiles (slippery)
  for(let r=0;r<lv.rows;r++)for(let c=0;c<lv.cols;c++){
    if(lv.ice[r][c]) drawIce(r,c);
  }
  // walls (the border + solid center divider read as one continuous wall)
  const midCol = (lv.cols-1)>>1;
  for(let r=0;r<lv.rows;r++)for(let c=0;c<lv.cols;c++){
    if(!lv.wall[r][c])continue;
    const onBorder = r===0||c===0||r===lv.rows-1||c===lv.cols-1||c===midCol;
    ctx.fillStyle = getCSS('--wall');
    drawCellRect(r,c, onBorder?1:4, onBorder?6:9); ctx.fill();
    ctx.fillStyle = getCSS('--wall-hi');
    roundRect(c*CELL+(onBorder?1:4), r*CELL+(onBorder?1:4), CELL-(onBorder?2:8), 5, 3); ctx.fill();
  }

  // doors
  drawDoor(lv.a, getCSS('--a'), sameCell(cur.A,lv.a));
  drawDoor(lv.b, getCSS('--b'), sameCell(cur.B,lv.b));

  // twins (nudge apart a touch if overlapping so both stay visible)
  let offA={x:0,y:0}, offB={x:0,y:0};
  if(sameCell(cur.A,cur.B)){ offA.x=-7; offB.x=7; }
  drawTwin(render.A, getCSS('--a'), 'A-glow', offA);
  drawTwin(render.B, getCSS('--b'), 'B-glow', offB);
}
function drawIce(r,c){
  const x=c*CELL, y=r*CELL;
  ctx.save();
  drawCellRect(r,c,5,10);
  const g=ctx.createLinearGradient(x,y,x+CELL,y+CELL);
  g.addColorStop(0,'rgba(150,205,245,.24)'); g.addColorStop(1,'rgba(120,175,225,.12)');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(190,225,255,.38)'; ctx.lineWidth=1.5; drawCellRect(r,c,5,10); ctx.stroke();
  ctx.strokeStyle='rgba(235,247,255,.55)'; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(x+CELL*0.30,y+CELL*0.20); ctx.lineTo(x+CELL*0.17,y+CELL*0.35);
  ctx.moveTo(x+CELL*0.56,y+CELL*0.22); ctx.lineTo(x+CELL*0.33,y+CELL*0.52);
  ctx.stroke();
  ctx.restore();
}
function drawDoor(pos,color,filled){
  const x=pos.c*CELL, y=pos.r*CELL, s=CELL;
  ctx.save();
  const pulse = filled ? (0.55+0.45*Math.sin(performance.now()/180)) : 1;
  ctx.strokeStyle=color; ctx.lineWidth=3; ctx.globalAlpha=filled?1:.9;
  ctx.setLineDash(filled?[]:[7,6]);
  roundRect(x+9,y+9,s-18,s-18,9); ctx.stroke();
  ctx.globalAlpha = filled?0.30*pulse:0.10;
  ctx.fillStyle=color; roundRect(x+9,y+9,s-18,s-18,9); ctx.fill();
  if(filled){
    ctx.globalAlpha=1; ctx.strokeStyle=color; ctx.lineWidth=4; ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x+s*0.36,y+s*0.52); ctx.lineTo(x+s*0.46,y+s*0.63); ctx.lineTo(x+s*0.66,y+s*0.38);
    ctx.stroke();
  }
  ctx.restore();
}
function drawTwin(rp,color,glowVar,off){
  const bx=(off?off.x:0), by=(off?off.y:0);
  const x=rp.x+bx, y=rp.y+by, s=CELL*0.60;
  ctx.save();
  ctx.shadowColor=color; ctx.shadowBlur=18;
  ctx.fillStyle=color;
  roundRect(x-s/2,y-s/2,s,s,12); ctx.fill();
  // glossy top
  ctx.shadowBlur=0; ctx.globalAlpha=.28; ctx.fillStyle='#ffffff';
  roundRect(x-s/2+5,y-s/2+5,s-10,s*0.34,8); ctx.fill();
  ctx.restore();
}
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function sameCell(p,q){ return p.r===q.r && p.c===q.c; }

// ---- main loop -------------------------------------------------------------
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  // ease render positions toward logical cells (+ bump offset)
  for(const key of ['A','B']){
    const tx=cx(cur[key].c), ty=cy(cur[key].r);
    const k = 1-Math.exp(-dt/0.055);
    const b=bump[key];
    if(b.t>0){ b.t=Math.max(0,b.t-dt/0.14); }
    const bx=b.x*b.t, by=b.y*b.t;
    render[key].x += (tx+bx - render[key].x)*k;
    render[key].y += (ty+by - render[key].y)*k;
  }
  draw();
  if(status==='play' && checkWin() && settled()) showWin();
  requestAnimationFrame(frame);
}

// ---- input -----------------------------------------------------------------
const KEYMAP = {
  ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],
  w:[-1,0],s:[1,0],a:[0,-1],d:[0,1], W:[-1,0],S:[1,0],A:[0,-1],D:[0,1]
};
window.addEventListener('keydown',e=>{
  if(document.getElementById('lvlmodal').classList.contains('show')){
    if(e.key==='Escape'){ e.preventDefault(); closeLevelSelect(); }
    return;
  }
  if(e.key in KEYMAP){
    e.preventDefault();
    if(status==='won'){ advance(); return; }
    const [dr,dc]=KEYMAP[e.key]; move(dr,dc); return;
  }
  if(e.key==='z'||e.key==='Z'){ e.preventDefault(); undo(); }
  else if(e.key==='r'||e.key==='R'){ e.preventDefault(); reset(); }
  else if((e.key==='Enter'||e.key===' ') && status==='won'){ e.preventDefault(); advance(); }
},{passive:false});

document.querySelectorAll('.dpad button').forEach(btn=>{

    const [dr,dc]=btn.dataset.dir.split(',').map(Number); move(dr,dc);
  });
});

document.getElementById('lvlmodal').addEventListener('click',e=>{ if(e.target.id==='lvlmodal') closeLevelSelect(); });
document.getElementById('resetProgress').onclick=()=>{
  if(confirm('Reset all progress? This clears every solved level.')){ progress={best:{},last:levelIndex}; saveProgress(); updateSolvedUI(); buildLevelGrid(); }
};

// swipe on canvas (mobile)
let touchStart=null;
canvas.addEventListener('touchstart',e=>{ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const t=e.changedTouches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  touchStart=null;
  if(status==='won'){ advance(); return; }
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy)) move(0, dx>0?1:-1); else move(dy>0?1:-1, 0);
},{passive:true});

window.addEventListener('resize',()=>{ if(lv) sizeCanvas(); });

// ---- go --------------------------------------------------------------------
loadProgress();
document.getElementById('totalCount').textContent = LEVELS.length;
loadLevel(Math.min(progress.last||0, LEVELS.length-1));
requestAnimationFrame(frame);
</script>
</body>
</html>
